<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!-- One kawung on nila cloth: four mori petals pointing at the corners, the kunyit query dot at
       the heart. The wax line and cecek inside each petal only show from 48px up, where there's
       room for them; at tab size they'd just grey the petals. -->
  <style>
    .wax { display: none }
    @media (min-width: 48px) { .wax { display: inline } }
  </style>
  <rect width="32" height="32" rx="3" fill="#0f1a47"/>
  <g transform="translate(16 16)">
    <g id="petal" transform="rotate(45)">
      <path fill="#efe9dc" d="M1.5 0C2.6-2.9 5.6-5.8 10.55-5.8S18.5-2.9 19.6 0C18.5 2.9 15.5 5.8 10.55 5.8S2.6 2.9 1.5 0Z"/>
      <g class="wax">
        <path fill="none" stroke="#0f1a47" stroke-width=".6" d="M7.4 0C8-1.3 9.4-2.4 11.6-2.4S15.2-1.3 15.8 0C15.2 1.3 13.8 2.4 11.6 2.4S8 1.3 7.4 0Z"/>
        <circle cx="17.6" r=".6" fill="#0f1a47"/>
      </g>
    </g>
    <use href="#petal" transform="rotate(90)"/>
    <use href="#petal" transform="rotate(180)"/>
    <use href="#petal" transform="rotate(270)"/>
  </g>
  <circle cx="16" cy="16" r="5.4" fill="#0f1a47"/>
  <circle cx="16" cy="16" r="3.6" fill="#f4b223"/>
</svg>
